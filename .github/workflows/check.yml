name: Package check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install zsh (syntax check of the shell examples)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check the package
        run: python3 -I validation/check_package.py
